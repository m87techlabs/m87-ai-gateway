apiVersion: 1
datasources:
  - name: M87 Prometheus
    uid: m87-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    editable: false
    jsonData:
      timeInterval: 15s
  - name: M87 Loki
    uid: m87-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
  - name: M87 Alertmanager
    uid: m87-alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    editable: false
    jsonData:
      implementation: prometheus
