name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      package_container:
        description: Build, verify and publish the container/native development preview
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,sdk-tests]"

      - name: Lint
        run: |
          ruff check src tests scripts examples
          ruff format --check src tests scripts examples
          bash -n start.sh stop.sh status.sh scripts/gateway-lifecycle.sh
          bash -n docker-start.sh docker-stop.sh docker-status.sh scripts/docker-lifecycle.sh
          bash -n examples/chat_app/start.sh examples/chat_app/stop.sh examples/chat_app/status.sh

      - name: Test
        run: pytest

      - name: Build package
        run: python -m pip wheel --no-deps . --wheel-dir dist

  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install bundle dependencies
        run: python -m pip install -e '.[bundle]'
      - name: Check platform storage and backup safety
        run: |
          python -m pip install pytest
          pytest -q tests/test_backup_workstation.py
      - name: Build portable preview executable
        run: python scripts/build_standalone.py
      - name: Verify bundled setup and request flow
        run: python scripts/smoke_standalone.py dist/m87-gateway${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Verify lifecycle scripts with the standalone executable
        if: runner.os == 'Linux'
        run: |
          python -m pip install pytest
          pytest -q tests/test_lifecycle_scripts.py -k standalone_fallback

      - name: Upload preview archives and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gateway-preview-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Check documentation links and fences
        run: python scripts/check_docs.py

      - name: Test Worker example
        working-directory: examples/cloudflare-worker
        run: npm test

      - name: Test console interactions
        run: |
          npm ci --prefix tests/console
          npm test --prefix tests/console

  container:
    if: github.event_name == 'workflow_dispatch' && inputs.package_container
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [test, docs]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" -t m87-ai-gateway:check .
      - name: Exercise Docker run and Compose
        run: python scripts/smoke_container.py m87-ai-gateway:check
      - name: Save verified image
        if: github.event_name == 'workflow_dispatch' && inputs.package_container && github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist/container
          docker save m87-ai-gateway:check | gzip > dist/container/gateway-image.tar.gz
      - name: Upload verified image for publication
        if: github.event_name == 'workflow_dispatch' && inputs.package_container && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gateway-container
          path: dist/container/gateway-image.tar.gz
          retention-days: 1

  publish-preview:
    if: github.event_name == 'workflow_dispatch' && inputs.package_container && github.ref == 'refs/heads/main'
    needs: [test, docs, bundle, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download tested image and native previews
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name gateway-container --dir container
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'gateway-preview-*' --dir previews
      - name: Publish verified container preview
        env:
          REGISTRY_USER: ${{ github.actor }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
          docker load --input container/gateway-image.tar.gz
          docker tag m87-ai-gateway:check "$image:sha-$GITHUB_SHA"
          docker tag m87-ai-gateway:check "$image:preview"
          docker push "$image:sha-$GITHUB_SHA"
          docker pull "$image:sha-$GITHUB_SHA"
          docker push "$image:preview"
          docker logout ghcr.io
      - name: Retain native previews and Compose as release downloads
        env:
          RELEASE_TITLE: Development preview
        run: |
          tag="preview-${GITHUB_SHA:0:12}"
          gh api "repos/$GITHUB_REPOSITORY/contents/docker-compose.yml?ref=$GITHUB_SHA" --jq .content | base64 --decode > docker-compose.yml
          cat > notes.md <<EOF
          Development preview built from commit $GITHUB_SHA. This is not a stable release or a workstation installer.

          Windows x64 and Ubuntu 24.04 x64 portable ZIPs include start, stop and status helpers. Download the matching checksum file. CI verifies native startup, setup, recovery and synthetic inference; clean workstation, signing and live cloud checks remain pending.

          Container: ghcr.io/${GITHUB_REPOSITORY,,}:sha-$GITHUB_SHA (Linux amd64). The preview tag follows the latest successful publication. The included Compose file publishes localhost:8087 and preserves data in a named volume. See the container deployment runbook for first-run operator access, networking and backup instructions.

          Validation: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Downloads remain attached to this preview until explicitly deleted. Repository and package visibility remain subject to existing access settings.
          EOF
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "$RELEASE_TITLE ${GITHUB_SHA:0:12}" --notes-file notes.md previews/*/*.zip previews/*/*.sha256 docker-compose.yml
