name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      package_container:
        description: Build, verify and publish the container development preview
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,sdk-tests]"

      - name: Lint
        run: |
          ruff check src tests scripts examples
          ruff format --check src tests scripts examples
          bash -n start.sh stop.sh status.sh scripts/gateway-lifecycle.sh
          bash -n docker-start.sh docker-stop.sh docker-status.sh scripts/docker-lifecycle.sh
          bash -n monitoring-start.sh monitoring-stop.sh monitoring-status.sh
          bash -n examples/chat_app/start.sh examples/chat_app/stop.sh examples/chat_app/status.sh

      - name: Test
        run: pytest

      - name: Verify monitoring rules and dashboard queries
        run: |
          tool_dir="$(mktemp -d)"
          curl --fail --location --silent --show-error https://github.com/prometheus/prometheus/releases/download/v3.5.0/prometheus-3.5.0.linux-amd64.tar.gz --output "$tool_dir/prometheus.tar.gz"
          printf '%s  %s\n' e811827af26d822afb09a4f28314f61b618b12cff5369835a67f674d8b46f39a "$tool_dir/prometheus.tar.gz" | sha256sum --check
          tar -xzf "$tool_dir/prometheus.tar.gz" -C "$tool_dir" prometheus-3.5.0.linux-amd64/promtool
          python scripts/check_observability.py --promtool "$tool_dir/prometheus-3.5.0.linux-amd64/promtool"

      - name: Build package
        run: python -m pip wheel --no-deps . --wheel-dir dist

  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install bundle dependencies
        run: python -m pip install -e '.[bundle]'
      - name: Check platform storage and backup safety
        run: |
          python -m pip install pytest
          pytest -q tests/test_backup_workstation.py
      - name: Build portable preview executable
        run: python scripts/build_standalone.py
      - name: Verify bundled setup and request flow
        run: python scripts/smoke_standalone.py dist/m87-gateway${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Verify lifecycle scripts with the standalone executable
        if: runner.os == 'Linux'
        run: |
          python -m pip install pytest
          pytest -q tests/test_lifecycle_scripts.py -k standalone_fallback

      - name: Upload preview archives and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gateway-preview-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Check documentation links and fences
        run: python scripts/check_docs.py

      - name: Test Worker example
        working-directory: examples/cloudflare-worker
        run: npm test

      - name: Test console interactions
        run: |
          npm ci --prefix tests/console
          npm test --prefix tests/console

  container:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.package_container)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [test, docs]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" -t m87-ai-gateway:check .
      - name: Exercise Docker run and Compose
        run: python scripts/smoke_container.py m87-ai-gateway:check

  publish-preview:
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.package_container))
    needs: [test, docs, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up arm64 emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Set up multi-architecture builds
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Publish amd64 and arm64 images
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            --tag "$image:sha-$GITHUB_SHA" --push .
          docker run --rm --platform linux/arm64 "$image:sha-$GITHUB_SHA" --version
          docker buildx imagetools create --tag "$image:preview" "$image:sha-$GITHUB_SHA"
          docker logout ghcr.io
