name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      package_container:
        description: Build, verify and publish the container development preview
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,sdk-tests]"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Build and test the console
        run: |
          npm ci --prefix console --no-audit --no-fund
          npm run build --prefix console
          npm test --prefix console

      - name: Lint
        run: |
          ruff check src tests scripts examples
          ruff format --check src tests scripts examples
          bash -n scripts/dev-start.sh scripts/dev-stop.sh scripts/dev-status.sh scripts/gateway-lifecycle.sh
          bash -n examples/chat_app/start.sh examples/chat_app/stop.sh examples/chat_app/status.sh

      - name: Test
        run: pytest

      - name: Verify monitoring rules and dashboard queries
        run: |
          tool_dir="$(mktemp -d)"
          curl --fail --location --silent --show-error https://github.com/prometheus/prometheus/releases/download/v3.5.0/prometheus-3.5.0.linux-amd64.tar.gz --output "$tool_dir/prometheus.tar.gz"
          printf '%s  %s\n' e811827af26d822afb09a4f28314f61b618b12cff5369835a67f674d8b46f39a "$tool_dir/prometheus.tar.gz" | sha256sum --check
          tar -xzf "$tool_dir/prometheus.tar.gz" -C "$tool_dir" prometheus-3.5.0.linux-amd64/promtool
          python scripts/check_observability.py --promtool "$tool_dir/prometheus-3.5.0.linux-amd64/promtool"

      - name: Build package
        run: python -m pip wheel --no-deps . --wheel-dir dist

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Check documentation links and fences
        run: python scripts/check_docs.py

      - name: Test Worker example
        working-directory: examples/cloudflare-worker
        run: npm test

      - name: Test the chat sample's page
        run: |
          npm ci --prefix tests/console
          npm test --prefix tests/console

  container:
    if: >-
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.package_container)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [test, docs]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Compose configuration
        run: docker compose config --quiet
      - name: Build image
        run: docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" -t m87-ai-gateway:check .
      - name: Exercise Docker run and Compose
        run: python scripts/smoke_container.py m87-ai-gateway:check

  publish:
    if: >-
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.package_container && github.ref == 'refs/heads/main')
    needs: [test, docs, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up arm64 emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Set up multi-architecture builds
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Check a version tag matches the code
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$version\"$" pyproject.toml
          grep -q "^__version__ = \"$version\"$" src/m87_gateway/__init__.py
          grep -q "^## \[$version\]" CHANGELOG.md
          test -s "docs/releases/$version.md"
      - name: Publish amd64 and arm64 images
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            --tag "$image:sha-$GITHUB_SHA" --push .
          docker run --rm --platform linux/arm64 "$image:sha-$GITHUB_SHA" --version
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            docker buildx imagetools create --tag "$image:$version" --tag "$image:${version%.*}" --tag "$image:latest" "$image:sha-$GITHUB_SHA"
          else
            docker buildx imagetools create --tag "$image:preview" "$image:sha-$GITHUB_SHA"
          fi
          docker logout ghcr.io

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish the release with a Compose file pinned to its image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir release
          sed -e "s#m87-ai-gateway:latest#m87-ai-gateway:$version#" -e '/^    build: \.$/d' docker-compose.yml > release/docker-compose.yml
          (cd release && docker compose config --quiet)
          gh release create "$GITHUB_REF_NAME" release/docker-compose.yml --verify-tag \
            --title "M87 AI Gateway $version" --notes-file "docs/releases/$version.md"
