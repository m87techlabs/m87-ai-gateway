# Run a release:        docker compose up -d
# Build this checkout:  docker compose up -d --build
# Stop or start again:  docker compose stop | docker compose start
# Update a release:     docker compose pull && docker compose up -d
# Add monitoring:       docker compose --profile monitoring up -d (needs a checkout)
# Optional settings come from .env; see .env.example.
services:
  m87-ai-gateway:
    image: ${GATEWAY_IMAGE:-ghcr.io/m87techlabs/m87-ai-gateway:latest}
    build: .
    ports:
      - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_PORT:-8087}:8087"
    environment:
      # Empty generates a key at /data/gateway/admin.key on first start.
      GATEWAY_ADMIN_API_KEY: ${GATEWAY_ADMIN_API_KEY:-}
      # Suggested endpoint for a model server running on this host.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # Single sign-on, off until an issuer is set. See docs/runbooks/single-sign-on.md.
      GATEWAY_OIDC_ISSUER: ${GATEWAY_OIDC_ISSUER:-}
      GATEWAY_OIDC_CLIENT_ID: ${GATEWAY_OIDC_CLIENT_ID:-}
      GATEWAY_OIDC_CLIENT_SECRET: ${GATEWAY_OIDC_CLIENT_SECRET:-}
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - m87-gateway
    volumes:
      - gateway-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 60s

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.13.5
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  loki:
    profiles: [monitoring]
    image: grafana/loki:3.7.9
    command: -config.file=/etc/loki/loki.yml
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    volumes:
      - ./deploy/observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  alertmanager:
    profiles: [monitoring]
    image: prom/alertmanager:v0.34.2
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./deploy/observability/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:13.2.5
    depends_on:
      - prometheus
      - loki
    environment:
      # Grafana asks you to change this default at first sign-in.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/opt/m87-observability/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  # Other Compose projects can join this and call http://m87-ai-gateway:8087/v1.
  m87-gateway:
    name: m87-gateway

volumes:
  gateway-data:
  prometheus-data:
  loki-data:
  alertmanager-data:
  grafana-data:
