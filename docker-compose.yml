services:
  m87-ai-gateway:
    build: .
    container_name: m87-ai-gateway
    ports:
      - "127.0.0.1:8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    volumes:
      - ./config.example.yaml:/app/config.example.yaml:ro
    restart: unless-stopped
