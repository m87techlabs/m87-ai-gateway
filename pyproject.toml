[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "m87-ai-gateway"
version = "0.1.1.dev0"
description = "A lightweight, self-hostable AI gateway for applications."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "M87 AI Gateway Maintainers" }
]
dependencies = [
  "fastapi>=0.115.0,<0.143.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pyyaml>=6.0.0",
  "httpx>=0.27.0",
  "prometheus-client>=0.20.0",
  "cryptography>=43.0.0",
]

[project.optional-dependencies]
sdk-tests = ["openai>=2,<3"]
bundle = ["pyinstaller>=6.0,<7"]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0"
]

[project.urls]
Repository = "https://github.com/m87techlabs/m87-ai-gateway"
Documentation = "https://github.com/m87techlabs/m87-ai-gateway/tree/main/docs"
Issues = "https://github.com/m87techlabs/m87-ai-gateway/issues"

[project.scripts]
m87-gateway = "m87_gateway.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
m87_gateway = ["control/static/*"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
